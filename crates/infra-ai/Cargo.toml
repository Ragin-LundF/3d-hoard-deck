[package]
name = "hoarddeck-infra-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
hoarddeck-application.workspace = true
serde_json.workspace = true
base64 = "0.22"
ureq = "3"
# The macOS Keychain, the Windows Credential Manager, and Secret Service on Linux (pure Rust, no system library). The
# async-io executor runs on its own, so the blocking calls work on any thread, inside the Tauri runtime or not.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }

[lints]
workspace = true
