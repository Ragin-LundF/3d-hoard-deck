[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
hoarddeck-domain = { path = "crates/domain" }
hoarddeck-application = { path = "crates/application" }
hoarddeck-infra-fs = { path = "crates/infra-fs" }
hoarddeck-infra-sqlite = { path = "crates/infra-sqlite" }
hoarddeck-infra-tantivy = { path = "crates/infra-tantivy" }
hoarddeck-app = { path = "crates/app" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
tantivy = "0.27"
rayon = "1.12"
globset = "0.4"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
module_name_repetitions = "allow"

[profile.dev.package."*"]
opt-level = 2
